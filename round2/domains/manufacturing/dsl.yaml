package_id: manufacturing-ontology
domain_id: manufacturing
version: v3
imports: []
object_types:
  - id: Supplier
    primary_key: supplierId
    properties:
      - name: supplierId
        type: string
        required: true
        immutable: true
      - name: status
        type: string
        required: false
        immutable: false
        constraints: ["enum:ACTIVE|SUSPENDED"]
      - name: leadTimeDays
        type: integer
        required: false
        immutable: false
      - name: riskClass
        type: string
        required: false
        immutable: false
        constraints: ["enum:LOW|MEDIUM|HIGH"]
    implements: [Statused]
  - id: Part
    primary_key: partId
    properties:
      - name: partId
        type: string
        required: true
        immutable: true
        description: "Canonical part id, e.g. PX-0017"
      - name: description
        type: string
        required: false
        immutable: false
      - name: unit
        type: string
        required: false
        immutable: false
      - name: criticality
        type: string
        required: false
        immutable: false
        constraints: ["enum:LOW|MEDIUM|HIGH|CRITICAL"]
    implements: []
  - id: PurchaseOrder
    primary_key: poId
    properties:
      - name: poId
        type: string
        required: true
        immutable: true
      - name: status
        type: string
        required: false
        immutable: false
        constraints: ["enum:OPEN|DELAYED|RECEIVED|CANCELLED"]
      - name: promisedAt
        type: integer
        required: false
        immutable: false
      - name: expectedAt
        type: integer
        required: false
        immutable: false
      - name: delayReason
        type: string
        required: false
        immutable: false
    implements: [Statused]
  - id: PurchaseOrderLine
    primary_key: iri
    properties:
      - name: iri
        type: string
        required: true
        immutable: true
        description: "RDF IRI of the instance; added because the IR requires a primary_key and the source class declares no id property"
      - name: quantity
        type: integer
        required: false
        immutable: false
    implements: [PartReferencing, Quantified]
  - id: InventoryLot
    primary_key: lotId
    properties:
      - name: lotId
        type: string
        required: true
        immutable: true
      - name: onHand
        type: integer
        required: false
        immutable: false
        constraints: ["min_inclusive:0"]
      - name: reserved
        type: integer
        required: false
        immutable: false
        constraints: ["min_inclusive:0"]
      - name: qualityStatus
        type: string
        required: false
        immutable: false
        constraints: ["enum:OK|QUARANTINE"]
    implements: [PartReferencing]
  - id: Warehouse
    primary_key: warehouseId
    properties:
      - name: warehouseId
        type: string
        required: true
        immutable: true
      - name: capacityClass
        type: string
        required: false
        immutable: false
        constraints: ["enum:SMALL|MEDIUM|LARGE"]
      - name: region
        type: string
        required: false
        immutable: false
    implements: []
  - id: WorkOrder
    primary_key: workOrderId
    properties:
      - name: workOrderId
        type: string
        required: true
        immutable: true
      - name: status
        type: string
        required: false
        immutable: false
        constraints: ["enum:PLANNED|RELEASED|RUNNING|DONE|CANCELLED"]
      - name: priority
        type: string
        required: false
        immutable: false
        constraints: ["enum:LOW|MEDIUM|HIGH"]
      - name: plannedStart
        type: integer
        required: false
        immutable: false
      - name: plannedFinish
        type: integer
        required: false
        immutable: false
    implements: [Statused]
  - id: BomRequirement
    primary_key: iri
    properties:
      - name: iri
        type: string
        required: true
        immutable: true
        description: "RDF IRI of the instance; added because the IR requires a primary_key and the source class declares no id property"
      - name: quantity
        type: integer
        required: false
        immutable: false
    implements: [Quantified]
  - id: ProductionLine
    primary_key: lineId
    properties:
      - name: lineId
        type: string
        required: true
        immutable: true
      - name: status
        type: string
        required: false
        immutable: false
        constraints: ["enum:ACTIVE|MAINTENANCE"]
      - name: capabilities
        type: string
        required: false
        immutable: false
        description: "MES JSONB capabilities array stored as its JSON-encoded string form in v1"
    implements: [Statused]
  - id: Shipment
    primary_key: iri
    properties:
      - name: iri
        type: string
        required: true
        immutable: true
        description: "RDF IRI of the instance; added because the IR requires a primary_key and the source class declares no id property"
    implements: []
  - id: WmsTransferRecord
    primary_key: actionExecutionId
    properties:
      - name: actionExecutionId
        type: string
        required: true
        immutable: true
      - name: requestedQuantity
        type: integer
        required: false
        immutable: false
      - name: actualQuantity
        type: integer
        required: false
        immutable: false
      - name: transferStatus
        type: string
        required: false
        immutable: false
        constraints: ["enum:COMMITTED|PARTIAL|FAILED|REVERSED"]
      - name: faultModeApplied
        type: string
        required: false
        immutable: false
        description: "test-mode only (OO_TEST_MODE=1)"
      - name: reversesActionExecutionId
        type: string
        required: false
        immutable: false
    implements: []
  - id: Decision
    primary_key: decisionId
    properties:
      - name: decisionId
        type: string
        required: true
        immutable: true
      - name: decisionType
        type: string
        required: true
        immutable: true
      - name: ontologyVersion
        type: string
        required: true
        immutable: true
      - name: shapeSetVersion
        type: string
        required: true
        immutable: true
      - name: authorizationModelVersion
        type: string
        required: true
        immutable: true
      - name: policyBundleVersion
        type: string
        required: true
        immutable: true
      - name: actionType
        type: string
        required: true
        immutable: true
      - name: actionVersion
        type: integer
        required: true
        immutable: true
      - name: createdAt
        type: datetime
        required: true
        immutable: false
      - name: identityMappingVersion
        type: string
        required: false
        immutable: false
      - name: projectionDefinitionVersion
        type: string
        required: false
        immutable: false
      - name: reconciliationPredicateVersion
        type: string
        required: false
        immutable: false
      - name: openfgaAuthorizationModelId
        type: string
        required: false
        immutable: false
      - name: unavailableGate
        type: string
        required: false
        immutable: false
        constraints: ["enum:authorization|policy"]
      - name: status
        type: string
        required: true
        immutable: false
        constraints: ["enum:DRAFT|PROPOSED|INSUFFICIENT_EVIDENCE|DENIED_AUTHORIZATION|DENIED_POLICY|INVALID_CONFORMANCE|REQUIRES_APPROVAL|APPROVED|EXECUTING|EXECUTION_FAILED|OUTCOME_UNKNOWN|AWAITING_OBSERVATION|DIVERGED|OBSERVED_SUCCESS|ACTION_VERSION_INVALIDATED|GATE_UNAVAILABLE"]
      - name: parametersJson
        type: string
        required: false
        immutable: true
      - name: decisionContentHash
        type: string
        required: false
        immutable: false
      - name: approvedAt
        type: datetime
        required: false
        immutable: false
      - name: approvalDecisionHash
        type: string
        required: false
        immutable: false
      - name: approvalScope
        type: string
        required: false
        immutable: false
      - name: actionPinnedSha256
        type: string
        required: false
        immutable: false
      - name: actionSha256AtExecute
        type: string
        required: false
        immutable: false
      - name: actionVersionInvalidatedAt
        type: datetime
        required: false
        immutable: false
    implements: []
  - id: EvidenceSnapshot
    primary_key: iri
    properties:
      - name: iri
        type: string
        required: true
        immutable: true
        description: "RDF IRI of the instance; added because the IR requires a primary_key and the source class declares no id property"
      - name: snapshotObservedAt
        type: datetime
        required: true
        immutable: false
      - name: snapshotContentHash
        type: string
        required: true
        immutable: false
      - name: sourcePositionsJson
        type: string
        required: false
        immutable: false
      - name: requiredFactsJson
        type: string
        required: false
        immutable: false
      - name: excludedFactsJson
        type: string
        required: false
        immutable: false
      - name: projectionRowHashesJson
        type: string
        required: false
        immutable: false
    implements: [ProvEntity]
  - id: DecisionActivity
    primary_key: iri
    properties:
      - name: iri
        type: string
        required: true
        immutable: true
        description: "RDF IRI of the instance; added because the IR requires a primary_key and the source class declares no id property"
    implements: [ProvActivity]
  - id: ActionExecution
    primary_key: actionExecutionId
    properties:
      - name: actionExecutionId
        type: string
        required: true
        immutable: true
        description: "same value is the idempotency key sent to the external system"
      - name: quantity
        type: integer
        required: false
        immutable: false
        constraints: ["min_inclusive:1"]
      - name: externalSystem
        type: string
        required: false
        immutable: false
        constraints: ["enum:WMS|ERP|MES"]
      - name: externalOperation
        type: string
        required: false
        immutable: false
      - name: commandStatus
        type: string
        required: false
        immutable: false
      - name: commandReceiptJson
        type: string
        required: false
        immutable: false
      - name: startedAt
        type: datetime
        required: false
        immutable: false
      - name: completedAt
        type: datetime
        required: false
        immutable: false
      - name: temporalWorkflowId
        type: string
        required: false
        immutable: false
    implements: [ProvActivity]
  - id: Outcome
    primary_key: outcomeId
    properties:
      - name: outcomeId
        type: string
        required: true
        immutable: true
      - name: reconciliationState
        type: string
        required: true
        immutable: false
        constraints: ["enum:NOT_STARTED|COMMAND_SENT|COMMAND_ACCEPTED|AWAITING_OBSERVATION|CONVERGED|DIVERGED|OUTCOME_UNKNOWN|COMPENSATING|COMPENSATED|FAILED"]
      - name: expectedEffectJson
        type: string
        required: true
        immutable: false
      - name: observedEffectJson
        type: string
        required: true
        immutable: false
      - name: observedAtOutcome
        type: datetime
        required: false
        immutable: false
      - name: compensationStatus
        type: string
        required: false
        immutable: false
        constraints: ["enum:NONE|NOT_APPLICABLE|COMPENSATING|COMPENSATED|COMPENSATION_FAILED"]
      - name: compensatingActionExecutionId
        type: string
        required: false
        immutable: false
      - name: sourceEvidenceLsn
        type: string
        required: false
        immutable: false
    implements: [ProvEntity]
  - id: HumanActor
    primary_key: actorId
    properties:
      - name: actorId
        type: string
        required: true
        immutable: true
        description: "e.g. planner-1, agent-1"
      - name: actorRole
        type: string
        required: false
        immutable: false
        constraints: ["enum:planner|junior_planner|supervisor|agent"]
    implements: [ProvAgent]
  - id: SoftwareAgent
    primary_key: actorId
    properties:
      - name: actorId
        type: string
        required: true
        immutable: true
        description: "e.g. planner-1, agent-1"
      - name: actorRole
        type: string
        required: false
        immutable: false
        constraints: ["enum:planner|junior_planner|supervisor|agent"]
    implements: [ProvAgent]
  - id: AuthorizationCheck
    primary_key: iri
    properties:
      - name: iri
        type: string
        required: true
        immutable: true
        description: "RDF IRI of the instance; added because the IR requires a primary_key and the source class declares no id property"
      - name: checkRelation
        type: string
        required: false
        immutable: false
      - name: checkObject
        type: string
        required: false
        immutable: false
      - name: checkOutcome
        type: string
        required: false
        immutable: false
        constraints: ["enum:ALLOWED|DENIED|UNAVAILABLE"]
      - name: checkedAt
        type: datetime
        required: false
        immutable: false
      - name: checkAuthorizationModelId
        type: string
        required: false
        immutable: false
    implements: [ProvEntity]
  - id: PolicyEvaluation
    primary_key: iri
    properties:
      - name: iri
        type: string
        required: true
        immutable: true
        description: "RDF IRI of the instance; added because the IR requires a primary_key and the source class declares no id property"
      - name: policyOutcome
        type: string
        required: false
        immutable: false
        constraints: ["enum:allow|deny|require_approval|UNAVAILABLE"]
      - name: policyReasonsJson
        type: string
        required: false
        immutable: false
      - name: policyObligationsJson
        type: string
        required: false
        immutable: false
      - name: policyInputHash
        type: string
        required: false
        immutable: false
      - name: policyInputJson
        type: string
        required: false
        immutable: false
    implements: [ProvEntity]
  - id: ConformanceCheck
    primary_key: iri
    properties:
      - name: iri
        type: string
        required: true
        immutable: true
        description: "RDF IRI of the instance; added because the IR requires a primary_key and the source class declares no id property"
      - name: conformanceOutcome
        type: string
        required: false
        immutable: false
        constraints: ["enum:CONFORMS|VIOLATED"]
      - name: conformanceViolationsJson
        type: string
        required: false
        immutable: false
    implements: [ProvEntity]
  - id: Observation
    primary_key: iri
    properties:
      - name: iri
        type: string
        required: true
        immutable: true
        description: "RDF IRI of the instance; added because the IR requires a primary_key and the source class declares no id property"
      - name: sourceSystem
        type: string
        required: false
        immutable: false
        constraints: ["enum:erp|mes|wms"]
      - name: sourceTable
        type: string
        required: false
        immutable: false
      - name: sourcePk
        type: string
        required: false
        immutable: false
      - name: sourceLsn
        type: string
        required: false
        immutable: false
        description: "Postgres WAL LSN; ordering authority, never wall clock"
      - name: sourceVersion
        type: integer
        required: false
        immutable: false
      - name: cdcOperation
        type: string
        required: false
        immutable: false
        constraints: ["enum:c|u|d|r"]
      - name: observedAt
        type: datetime
        required: false
        immutable: false
      - name: applied
        type: boolean
        required: false
        immutable: false
    implements: [ProvActivity]
  - id: SourcePosition
    primary_key: iri
    properties:
      - name: iri
        type: string
        required: true
        immutable: true
        description: "RDF IRI of the instance; added because the IR requires a primary_key and the source class declares no id property"
      - name: lastLsn
        type: string
        required: false
        immutable: false
      - name: lastVersion
        type: integer
        required: false
        immutable: false
      - name: lastObservedAt
        type: datetime
        required: false
        immutable: false
    implements: []
  - id: IdentityResolutionActivity
    primary_key: iri
    properties:
      - name: iri
        type: string
        required: true
        immutable: true
        description: "RDF IRI of the instance; added because the IR requires a primary_key and the source class declares no id property"
    implements: [ProvActivity]
  - id: IdentityMapping
    primary_key: iri
    properties:
      - name: iri
        type: string
        required: true
        immutable: true
        description: "RDF IRI of the instance; added because the IR requires a primary_key and the source class declares no id property"
      - name: mappingRuleId
        type: string
        required: false
        immutable: false
      - name: mappingRuleVersion
        type: string
        required: false
        immutable: false
      - name: sourceLocalId
        type: string
        required: false
        immutable: false
      - name: authority
        type: string
        required: false
        immutable: false
      - name: confidence
        type: number
        required: false
        immutable: false
        description: "xsd:decimal"
      - name: createdAtMapping
        type: datetime
        required: false
        immutable: false
    implements: [ProvEntity]
  - id: QuarantinedIdentity
    primary_key: iri
    properties:
      - name: iri
        type: string
        required: true
        immutable: true
        description: "RDF IRI of the instance; added because the IR requires a primary_key and the source class declares no id property"
      - name: quarantineReason
        type: string
        required: false
        immutable: false
    implements: [ProvEntity]
link_types:
  - id: PurchaseOrder_suppliedBy
    from: PurchaseOrder
    to: Supplier
    from_cardinality:
      min: 1
      max: 1
    to_cardinality:
      min: 0
      max: "*"
    directed: true
    properties: []
  - id: PurchaseOrderLine_purchaseOrder
    from: PurchaseOrderLine
    to: PurchaseOrder
    from_cardinality:
      min: 1
      max: 1
    to_cardinality:
      min: 0
      max: "*"
    directed: true
    properties: []
  - id: PartReferencing_part
    from: PartReferencing
    to: Part
    from_cardinality:
      min: 0
      max: 1
    to_cardinality:
      min: 0
      max: "*"
    directed: true
    properties: []
  - id: PurchaseOrderLine_destinationWarehouse
    from: PurchaseOrderLine
    to: Warehouse
    from_cardinality:
      min: 1
      max: 1
    to_cardinality:
      min: 0
      max: "*"
    directed: true
    properties: []
  - id: InventoryLot_warehouse
    from: InventoryLot
    to: Warehouse
    from_cardinality:
      min: 0
      max: 1
    to_cardinality:
      min: 0
      max: "*"
    directed: true
    properties: []
  - id: WorkOrder_productionLine
    from: WorkOrder
    to: ProductionLine
    from_cardinality:
      min: 1
      max: 1
    to_cardinality:
      min: 0
      max: "*"
    directed: true
    properties: []
  - id: WorkOrder_warehouse
    from: WorkOrder
    to: Warehouse
    from_cardinality:
      min: 1
      max: 1
    to_cardinality:
      min: 0
      max: "*"
    directed: true
    properties: []
  - id: BomRequirement_workOrder
    from: BomRequirement
    to: WorkOrder
    from_cardinality:
      min: 1
      max: 1
    to_cardinality:
      min: 0
      max: "*"
    directed: true
    properties: []
  - id: BomRequirement_requiresPart
    from: BomRequirement
    to: Part
    from_cardinality:
      min: 1
      max: 1
    to_cardinality:
      min: 0
      max: "*"
    directed: true
    properties: []
  - id: WmsTransferRecord_sourceWarehouse
    from: WmsTransferRecord
    to: Warehouse
    from_cardinality:
      min: 1
      max: 1
    to_cardinality:
      min: 0
      max: "*"
    directed: true
    properties: []
  - id: Decision_actor
    from: Decision
    to: ProvAgent
    from_cardinality:
      min: 1
      max: 1
    to_cardinality:
      min: 0
      max: "*"
    directed: true
    properties: []
  - id: Decision_evidenceSnapshot
    from: Decision
    to: EvidenceSnapshot
    from_cardinality:
      min: 1
      max: 1
    to_cardinality:
      min: 0
      max: "*"
    directed: true
    properties: []
  - id: Decision_authorizationCheck
    from: Decision
    to: AuthorizationCheck
    from_cardinality:
      min: 0
      max: 1
    to_cardinality:
      min: 0
      max: "*"
    directed: true
    properties: []
  - id: Decision_policyEvaluation
    from: Decision
    to: PolicyEvaluation
    from_cardinality:
      min: 0
      max: 1
    to_cardinality:
      min: 0
      max: "*"
    directed: true
    properties: []
  - id: Decision_conformanceCheck
    from: Decision
    to: ConformanceCheck
    from_cardinality:
      min: 0
      max: 1
    to_cardinality:
      min: 0
      max: "*"
    directed: true
    properties: []
  - id: Decision_approvedBy
    from: Decision
    to: ProvAgent
    from_cardinality:
      min: 0
      max: 1
    to_cardinality:
      min: 0
      max: "*"
    directed: true
    properties: []
  - id: Decision_executedBy
    from: Decision
    to: ProvAgent
    from_cardinality:
      min: 0
      max: 1
    to_cardinality:
      min: 0
      max: "*"
    directed: true
    properties: []
  - id: Decision_actionExecution
    from: Decision
    to: ActionExecution
    from_cardinality:
      min: 0
      max: 1
    to_cardinality:
      min: 1
      max: 1
    directed: true
    properties: []
  - id: Decision_concernsWorkOrder
    from: Decision
    to: WorkOrder
    from_cardinality:
      min: 0
      max: 1
    to_cardinality:
      min: 0
      max: "*"
    directed: true
    properties: []
  - id: Decision_concernsPart
    from: Decision
    to: Part
    from_cardinality:
      min: 0
      max: 1
    to_cardinality:
      min: 0
      max: "*"
    directed: true
    properties: []
  - id: Decision_concernsSourceWarehouse
    from: Decision
    to: Warehouse
    from_cardinality:
      min: 0
      max: 1
    to_cardinality:
      min: 0
      max: "*"
    directed: true
    properties: []
  - id: Decision_concernsDestinationWarehouse
    from: Decision
    to: Warehouse
    from_cardinality:
      min: 0
      max: 1
    to_cardinality:
      min: 0
      max: "*"
    directed: true
    properties: []
  - id: ActionExecution_sourceWarehouse
    from: ActionExecution
    to: Warehouse
    from_cardinality:
      min: 0
      max: 1
    to_cardinality:
      min: 0
      max: "*"
    directed: true
    properties: []
  - id: ActionExecution_destinationWarehouse
    from: ActionExecution
    to: Warehouse
    from_cardinality:
      min: 0
      max: 1
    to_cardinality:
      min: 0
      max: "*"
    directed: true
    properties: []
  - id: ActionExecution_outcome
    from: ActionExecution
    to: Outcome
    from_cardinality:
      min: 0
      max: 1
    to_cardinality:
      min: 1
      max: 1
    directed: true
    properties: []
  - id: SoftwareAgent_actsOnBehalfOf
    from: SoftwareAgent
    to: HumanActor
    from_cardinality:
      min: 0
      max: 1
    to_cardinality:
      min: 0
      max: "*"
    directed: true
    properties: []
  - id: Observation_mappingRuleUsed
    from: Observation
    to: IdentityMapping
    from_cardinality:
      min: 0
      max: 1
    to_cardinality:
      min: 0
      max: "*"
    directed: true
    properties: []
  - id: IdentityMapping_canonicalId
    from: IdentityMapping
    to: Part
    from_cardinality:
      min: 0
      max: 1
    to_cardinality:
      min: 0
      max: "*"
    directed: true
    properties: []
interfaces:
  - id: Statused
    required_properties:
      - name: status
        type: string
        required: false
        immutable: false
    required_links: []
    capabilities: []
  - id: PartReferencing
    required_properties: []
    required_links: [PartReferencing_part]
    capabilities: []
  - id: Quantified
    required_properties:
      - name: quantity
        type: integer
        required: false
        immutable: false
    required_links: []
