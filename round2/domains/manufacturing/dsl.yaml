constraints:
  - id: inventory-on-hand-nonnegative
    scope: InventoryLot
    expression_ref: "shacl:fac:InventoryLotShape#onHand minInclusive 0"
    severity: hard
  - id: inventory-reserved-nonnegative
    scope: InventoryLot
    expression_ref: "shacl:fac:InventoryLotShape#reserved minInclusive 0"
    severity: hard
  - id: inventory-on-hand-covers-reserved
    scope: InventoryLot
    expression_ref: "invariant: onHand >= reserved"
    severity: hard
  - id: inventory-available-nonnegative
    scope: InventoryLot
    expression_ref: "invariant: onHand - reserved >= 0"
    severity: hard
  - id: quality-status-vocabulary
    scope: InventoryLot
    expression_ref: "enum:OK|QUARANTINE on qualityStatus"
    severity: hard
  - id: work-order-status-vocabulary
    scope: WorkOrder
    expression_ref: "enum:PLANNED|RELEASED|RUNNING|DONE|CANCELLED on status"
    severity: hard
  - id: decision-status-vocabulary
    scope: Decision
    expression_ref: "shacl:oo:DecisionShape#status sh:in"
    severity: hard
  - id: reconciliation-state-vocabulary
    scope: Outcome
    expression_ref: "shacl:oo:OutcomeShape#reconciliationState sh:in"
    severity: hard
  - id: action-execution-quantity-positive
    scope: ActionExecution
    expression_ref: "shacl:oo:ActionExecutionShape#quantity minInclusive 1"
    severity: hard
  - id: transfer-endpoints-disjoint
    scope: ActionExecution
    expression_ref: "shacl:oo:ActionExecutionShape#sourceWarehouse disjoint destinationWarehouse"
    severity: hard
  - id: idempotency-key-unique
    scope: ActionExecution
    expression_ref: "invariant: actionExecutionId applied at most once"
    severity: hard
  - id: decision-content-immutable
    scope: Decision
    expression_ref: "invariant: recomputed decision_content_hash equals the stored hash"
    severity: hard
  - id: no-effect-without-approval
    scope: Decision
    expression_ref: "invariant: denial/pending statuses carry no execution or outcome"
    severity: hard
  - id: transfer-safety-stock
    scope: transfer_inventory
    expression_ref: "rego:factory.inventory.transfer_v2#remaining >= safety_stock"
    severity: hard
  - id: transfer-quarantine-blocked
    scope: transfer_inventory
    expression_ref: "rego:factory.inventory.transfer_v2#no QUARANTINE on source or destination"
    severity: hard
  - id: evidence-freshness
    scope: transfer_inventory
    expression_ref: "closure.max_evidence_freshness_s <= 5"
    severity: hard
  - id: transfer-approval-threshold
    scope: transfer_inventory
    expression_ref: "quantity <= approval_threshold_units (80) without approval"
    severity: soft
  - id: expedite-approval-threshold
    scope: expedite_purchase_order
    expression_ref: "expedite_fee <= approval_threshold_cost (500) without approval"
    severity: soft
  - id: high-priority-reschedule-approval
    scope: reschedule_work_order
    expression_ref: "priority != HIGH without approval"
    severity: soft
