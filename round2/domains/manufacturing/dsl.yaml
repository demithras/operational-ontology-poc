actions:
  - id: transfer_inventory
    inputs:
      - name: source_warehouse
        type: {ref: Warehouse}
        required: true
      - name: destination_warehouse
        type: {ref: Warehouse}
        required: true
      - name: part
        type: {ref: Part}
        required: true
      - name: quantity
        type: integer
        required: true
      - name: work_order
        type: {ref: WorkOrder}
        required: false
    authority_refs: ["auth:transfer-inventory-planner", "auth:transfer-inventory-junior-planner", "auth:transfer-inventory-agent-grant", "auth:approve-large-transfer-senior-approver", "auth:mitigate-high-priority-planner", "auth:mitigate-high-priority-supervisor"]
    policy_refs: ["policy:transfer_inventory_hard_deny", "policy:transfer_inventory_needs_approval", "policy:transfer_inventory_allow"]
    preconditions: ["quantity >= 1", "source != destination", "source_available >= quantity"]
    effects:
      - target: WMS
        operation: external_call
        fields: [destination, part, quantity, source]
    idempotency: required
    outcome_predicate: "WMS_CDC observation within PT30S: the WmsTransferRecord correlated by action_execution_id has status COMMITTED and actual_quantity == requested_quantity (source.available decreases by quantity; destination.available increases by quantity)"
    compensation_action: null
    version: v3
  - id: expedite_purchase_order
    inputs:
      - name: po_id
        type: {ref: PurchaseOrder}
        required: true
      - name: expedite_fee
        type: integer
        required: true
    authority_refs: ["auth:transfer-inventory-planner", "auth:transfer-inventory-junior-planner", "auth:transfer-inventory-agent-grant", "auth:approve-large-transfer-supervisor"]
    policy_refs: ["policy:expedite_purchase_order_hard_deny", "policy:expedite_purchase_order_needs_approval", "policy:expedite_purchase_order_allow"]
    preconditions: ["expedite_fee >= 0", "po_status not in [RECEIVED, CANCELLED]"]
    effects:
      - target: ERP
        operation: external_call
        fields: [expedite_fee]
    idempotency: required
    outcome_predicate: "ERP_CDC observation within PT30S: purchase_order.expected_at decreases"
    compensation_action: null
    version: v1
  - id: reschedule_work_order
    inputs:
      - name: work_order_id
        type: {ref: WorkOrder}
        required: true
      - name: new_planned_start
        type: integer
        required: true
    authority_refs: ["auth:transfer-inventory-planner", "auth:transfer-inventory-junior-planner", "auth:transfer-inventory-agent-grant", "auth:approve-large-transfer-supervisor"]
    policy_refs: ["policy:reschedule_work_order_hard_deny", "policy:reschedule_work_order_needs_approval", "policy:reschedule_work_order_allow"]
    preconditions: ["work_order_status not in [DONE, CANCELLED]"]
    effects:
      - target: MES
        operation: external_call
        fields: [new_planned_start]
    idempotency: required
    outcome_predicate: "MES_CDC observation within PT30S: work_order.planned_start changes to new_planned_start"
    compensation_action: reschedule_work_order
    version: v1
