name: oo-poc

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      POSTGRES_DB: postgres
      ERP_DB_NAME: ${ERP_DB_NAME}
      ERP_DB_USER: ${ERP_DB_USER}
      ERP_DB_PASSWORD: ${ERP_DB_PASSWORD}
      MES_DB_NAME: ${MES_DB_NAME}
      MES_DB_USER: ${MES_DB_USER}
      MES_DB_PASSWORD: ${MES_DB_PASSWORD}
      WMS_DB_NAME: ${WMS_DB_NAME}
      WMS_DB_USER: ${WMS_DB_USER}
      WMS_DB_PASSWORD: ${WMS_DB_PASSWORD}
      ONTOLOGY_HOT_DB_NAME: ${ONTOLOGY_HOT_DB_NAME}
      ONTOLOGY_HOT_DB_USER: ${ONTOLOGY_HOT_DB_USER}
      ONTOLOGY_HOT_DB_PASSWORD: ${ONTOLOGY_HOT_DB_PASSWORD}
      BASELINE_DB_NAME: ${BASELINE_DB_NAME}
      BASELINE_DB_USER: ${BASELINE_DB_USER}
      BASELINE_DB_PASSWORD: ${BASELINE_DB_PASSWORD}
    # wal_level=logical is not needed until Phase 6 (Debezium CDC) but is
    # set from Phase 2 on so no later phase needs a data-losing `make reset`
    # just to flip it (phase2.md item 1).
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_replication_slots=4"
      - "-c"
      - "max_wal_senders=4"
    ports:
      - "${POSTGRES_HOST_PORT}:5432"
    volumes:
      - oo-poc-pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SUPERUSER} -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  erp:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["uvicorn", "services.erp.app:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      SERVICE_DB_HOST: postgres
      SERVICE_DB_PORT: "5432"
      SERVICE_DB_NAME: ${ERP_DB_NAME}
      SERVICE_DB_USER: ${ERP_DB_USER}
      SERVICE_DB_PASSWORD: ${ERP_DB_PASSWORD}
      OO_TEST_MODE: ${OO_TEST_MODE}
    ports:
      - "${ERP_HTTP_PORT}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 30

  mes:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["uvicorn", "services.mes.app:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      SERVICE_DB_HOST: postgres
      SERVICE_DB_PORT: "5432"
      SERVICE_DB_NAME: ${MES_DB_NAME}
      SERVICE_DB_USER: ${MES_DB_USER}
      SERVICE_DB_PASSWORD: ${MES_DB_PASSWORD}
      OO_TEST_MODE: ${OO_TEST_MODE}
    ports:
      - "${MES_HTTP_PORT}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 30

  wms:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["uvicorn", "services.wms.app:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      SERVICE_DB_HOST: postgres
      SERVICE_DB_PORT: "5432"
      SERVICE_DB_NAME: ${WMS_DB_NAME}
      SERVICE_DB_USER: ${WMS_DB_USER}
      SERVICE_DB_PASSWORD: ${WMS_DB_PASSWORD}
      OO_TEST_MODE: ${OO_TEST_MODE}
    ports:
      - "${WMS_HTTP_PORT}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 30

  # --- Phase 3: semantic core + CDC ingestion (ADR 0002 — CDC built now, not
  # deferred to Phase 6) -------------------------------------------------

  kafka:
    image: quay.io/debezium/kafka:2.7
    environment:
      CLUSTER_ID: oo-poc-kraft-cluster-1
      NODE_ID: "1"
      NODE_ROLE: combined
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9094
      # Two listeners: PLAINTEXT ("kafka:9092") is what other containers
      # (connect, ingestion) use on the compose network and is also what
      # the healthcheck below connects to via localhost. EXTERNAL
      # ("localhost:$KAFKA_HOST_PORT") is for host-side debugging/tests —
      # Kafka clients don't just use the bootstrap address, they reconnect
      # to whatever the broker's metadata response ADVERTISES, so a
      # host-side client bootstrapping via the published port alone still
      # fails once it tries to follow that metadata to "kafka:9092" (not
      # resolvable outside the compose network) without this second
      # listener (found empirically: a host-run consumer.py connected to
      # `localhost:15492` fine, then failed with "Failed to resolve
      # 'kafka:9092'" on its first real fetch).
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,EXTERNAL://0.0.0.0:9093,CONTROLLER://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:${KAFKA_HOST_PORT}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms256m"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "${KAFKA_HOST_PORT}:9093"
    healthcheck:
      test: ["CMD-SHELL", "/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 3s
      timeout: 5s
      retries: 60

  connect:
    image: quay.io/debezium/connect:2.7
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: oo-poc-connect
      CONFIG_STORAGE_TOPIC: oo_connect_configs
      OFFSET_STORAGE_TOPIC: oo_connect_offsets
      STATUS_STORAGE_TOPIC: oo_connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: "1"
      OFFSET_STORAGE_REPLICATION_FACTOR: "1"
      STATUS_STORAGE_REPLICATION_FACTOR: "1"
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms256m"
    ports:
      - "${CONNECT_HOST_PORT}:8083"
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8083/ >/dev/null"]
      interval: 3s
      timeout: 5s
      retries: 60

  rdf4j:
    image: eclipse/rdf4j-workbench:6.1.0-tomcat
    environment:
      JAVA_OPTS: "-Xmx768m"
    ports:
      - "${RDF4J_HOST_PORT}:8080"
    volumes:
      - oo-poc-rdf4j-data:/var/rdf4j
    # eclipse/rdf4j-workbench's Tomcat/JRE base image has neither curl nor
    # wget nor python3 — only bash — so the healthcheck speaks raw HTTP/1.0
    # over bash's /dev/tcp instead (verified against the running container).
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8080; printf \"GET /rdf4j-server/protocol HTTP/1.0\\r\\n\\r\\n\" >&3; head -1 <&3' | grep -q 200"]
      interval: 3s
      timeout: 5s
      retries: 60

  ingestion:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python3", "-m", "services.ingestion.consumer"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      RDF4J_BASE_URL: http://rdf4j:8080/rdf4j-server
      RDF4J_REPOSITORY: oo
      OO_INGESTION_HEALTH_PORT: "8090"
    ports:
      - "${INGESTION_HEALTH_PORT}:8090"
    depends_on:
      kafka:
        condition: service_healthy
      rdf4j:
        condition: service_healthy
      connect:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/health', timeout=2)"]
      interval: 3s
      timeout: 5s
      retries: 60

  # --- Phase 4: hot projections (docs/experiment/briefs/phase4.md) -------

  projection_builder:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python3", "-m", "services.projection_builder.main"]
    environment:
      SERVICE_DB_HOST: postgres
      SERVICE_DB_PORT: "5432"
      SERVICE_DB_NAME: ${ONTOLOGY_HOT_DB_NAME}
      SERVICE_DB_USER: ${ONTOLOGY_HOT_DB_USER}
      SERVICE_DB_PASSWORD: ${ONTOLOGY_HOT_DB_PASSWORD}
      RDF4J_BASE_URL: http://rdf4j:8080/rdf4j-server
      RDF4J_REPOSITORY: oo
      OO_PROJECTION_POLL_INTERVAL_S: ${OO_PROJECTION_POLL_INTERVAL_S}
      OO_PROJECTION_HEALTH_PORT: "8091"
    ports:
      - "${PROJECTION_BUILDER_HEALTH_PORT}:8091"
    depends_on:
      postgres:
        condition: service_healthy
      rdf4j:
        condition: service_healthy
      ingestion:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8091/health', timeout=2)"]
      interval: 3s
      timeout: 5s
      retries: 60

  # --- Phase 5: decision service + gates (docs/experiment/briefs/phase5.md) --

  openfga:
    image: openfga/openfga:latest
    command: ["run"]
    environment:
      OPENFGA_DATASTORE_ENGINE: memory
      OPENFGA_PLAYGROUND_ENABLED: "false"
    ports:
      - "${OPENFGA_HOST_PORT}:8080"
    # openfga/openfga's image has neither a shell nor curl/wget (verified:
    # `docker run --entrypoint /bin/sh` -> "no such file or directory"), so a
    # CMD-SHELL/CMD healthcheck cannot run *inside* the container at all.
    # Rather than fake one, this service intentionally has none — Makefile's
    # `wait-healthy` (services/common/wait_healthy.py) treats a service with
    # no configured healthcheck as ready once its State is "running", and
    # services/decision_service/bootstrap_openfga.py separately polls the
    # real HTTP /healthz endpoint (verified empirically: returns
    # {"status":"SERVING"}) with its own retry/backoff before writing the
    # store/model/tuples — so actual API readiness is still proven, just
    # from outside the container.
    depends_on: {}

  opa:
    image: openpolicyagent/opa:latest
    command: ["run", "--server", "--addr", "0.0.0.0:8181", "--watch", "/policies"]
    volumes:
      - ./contracts/policies/v1:/policies:ro
    ports:
      - "${OPA_HOST_PORT}:8181"
    # Same no-shell/no-curl situation as openfga above (verified empirically)
    # — no docker-level healthcheck; `wait-healthy` treats "no healthcheck +
    # running" as ready, and decision_service's own OPA client fails closed
    # (F24) if a request lands before OPA is actually serving.
    depends_on: {}

  decision_service:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["uvicorn", "services.decision_service.app:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      SERVICE_DB_HOST: postgres
      SERVICE_DB_PORT: "5432"
      SERVICE_DB_NAME: ${ONTOLOGY_HOT_DB_NAME}
      SERVICE_DB_USER: ${ONTOLOGY_HOT_DB_USER}
      SERVICE_DB_PASSWORD: ${ONTOLOGY_HOT_DB_PASSWORD}
      RDF4J_BASE_URL: http://rdf4j:8080/rdf4j-server
      RDF4J_REPOSITORY: oo
      OPENFGA_API_URL: http://openfga:8080
      OPA_BASE_URL: http://opa:8181
      WMS_BASE_URL: http://wms:8000
      ERP_BASE_URL: http://erp:8000
      MES_BASE_URL: http://mes:8000
      INGESTION_HEALTH_URL: http://ingestion:8090
      TEMPORAL_ADDRESS: temporal:7233
      OO_TEST_MODE: ${OO_TEST_MODE}
    ports:
      - "${DECISION_SERVICE_HTTP_PORT}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      rdf4j:
        condition: service_healthy
      projection_builder:
        condition: service_healthy
      ingestion:
        condition: service_healthy
      wms:
        condition: service_healthy
      erp:
        condition: service_healthy
      mes:
        condition: service_healthy
      temporal:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 3s
      timeout: 5s
      retries: 60

  # --- Phase 6: durable action runtime (docs/experiment/briefs/phase6.md) ---
  # Temporal's OWN dedicated Postgres (never the shared oo-poc instance —
  # db/init/00_init.sh only runs on first volume init, so a new database on
  # the shared server would need a data-losing reset; a separate container
  # needs no such migration).
  temporal-postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${TEMPORAL_POSTGRES_USER}
      POSTGRES_PASSWORD: ${TEMPORAL_POSTGRES_PASSWORD}
    volumes:
      - oo-poc-temporal-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TEMPORAL_POSTGRES_USER}"]
      interval: 2s
      timeout: 3s
      retries: 30

  temporal:
    image: temporalio/auto-setup:latest
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_SEEDS: temporal-postgres
      POSTGRES_USER: ${TEMPORAL_POSTGRES_USER}
      POSTGRES_PWD: ${TEMPORAL_POSTGRES_PASSWORD}
      DBNAME: temporal
      VISIBILITY_DBNAME: temporal_visibility
    ports:
      - "${TEMPORAL_FRONTEND_HOST_PORT}:7233"
    depends_on:
      temporal-postgres:
        condition: service_healthy
    # verified empirically: the auto-setup image has `nc` (auto-setup.sh's
    # own wait_for_postgres uses it) — a raw TCP check on the frontend gRPC
    # port, same "no app-level curl available" pattern as rdf4j's /dev/tcp
    # healthcheck. `nc -z localhost 7233` FAILS (exit 1) even once the
    # server is fully up — temporal-server binds the frontend port on the
    # container's OWN bridge-network IP (`172.x.x.x:7233`, visible via
    # `netstat -tlnp` inside the container), never on `127.0.0.1`, so a
    # loopback check can never succeed; `nc -z temporal 7233` (the
    # container's own compose service hostname, resolvable to that same IP
    # via Docker's embedded DNS from inside the container itself) does.
    # Real namespace readiness is proven separately by
    # services/action_worker/bootstrap_temporal.py (mirrors
    # services/decision_service/bootstrap_openfga.py) before anything
    # starts a workflow.
    healthcheck:
      test: ["CMD-SHELL", "nc -z temporal 7233"]
      interval: 3s
      timeout: 5s
      retries: 60

  # Optional (brief item 1: "optional temporal-ui") — nothing in this repo's
  # tests depends on this being reachable; human-debugging convenience only.
  temporal-ui:
    image: temporalio/ui:latest
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: "http://localhost:${TEMPORAL_UI_HOST_PORT}"
    ports:
      - "${TEMPORAL_UI_HOST_PORT}:8080"
    depends_on:
      temporal:
        condition: service_healthy

  action_worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python3", "-m", "services.action_worker.worker"]
    environment:
      SERVICE_DB_HOST: postgres
      SERVICE_DB_PORT: "5432"
      SERVICE_DB_NAME: ${ONTOLOGY_HOT_DB_NAME}
      SERVICE_DB_USER: ${ONTOLOGY_HOT_DB_USER}
      SERVICE_DB_PASSWORD: ${ONTOLOGY_HOT_DB_PASSWORD}
      RDF4J_BASE_URL: http://rdf4j:8080/rdf4j-server
      RDF4J_REPOSITORY: oo
      TEMPORAL_ADDRESS: temporal:7233
      WMS_BASE_URL: http://wms:8000
      ERP_BASE_URL: http://erp:8000
      MES_BASE_URL: http://mes:8000
      INGESTION_HEALTH_URL: http://ingestion:8090
      OO_ACTION_WORKER_HEALTH_PORT: "8092"
      OO_TEST_MODE: ${OO_TEST_MODE}
    ports:
      - "${ACTION_WORKER_HEALTH_PORT}:8092"
    depends_on:
      postgres:
        condition: service_healthy
      rdf4j:
        condition: service_healthy
      temporal:
        condition: service_healthy
      wms:
        condition: service_healthy
      erp:
        condition: service_healthy
      mes:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8092/health', timeout=2)"]
      interval: 3s
      timeout: 5s
      retries: 60

  reconciliation:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python3", "-m", "services.reconciliation.main"]
    environment:
      SERVICE_DB_HOST: postgres
      SERVICE_DB_PORT: "5432"
      SERVICE_DB_NAME: ${ONTOLOGY_HOT_DB_NAME}
      SERVICE_DB_USER: ${ONTOLOGY_HOT_DB_USER}
      SERVICE_DB_PASSWORD: ${ONTOLOGY_HOT_DB_PASSWORD}
      RDF4J_BASE_URL: http://rdf4j:8080/rdf4j-server
      RDF4J_REPOSITORY: oo
      WMS_BASE_URL: http://wms:8000
      ERP_BASE_URL: http://erp:8000
      MES_BASE_URL: http://mes:8000
      OO_RECONCILIATION_POLL_INTERVAL_S: "2"
      OO_RECONCILIATION_HEALTH_PORT: "8093"
    ports:
      - "${RECONCILIATION_HEALTH_PORT}:8093"
    depends_on:
      postgres:
        condition: service_healthy
      rdf4j:
        condition: service_healthy
      ingestion:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8093/health', timeout=2)"]
      interval: 3s
      timeout: 5s
      retries: 60

volumes:
  oo-poc-pgdata:
  oo-poc-rdf4j-data:
  oo-poc-temporal-pgdata:
