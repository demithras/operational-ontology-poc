[project]
name = "operational-ontology-poc"
version = "0.1.0"
description = "Falsifiable local POC for an operational ontology (see docs/experiment/spec/)"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "pyyaml>=6.0",
    # Phase 2 — fake ERP/MES/WMS services (services/) + their integration
    # tests (tests/integration/).
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "psycopg[binary,pool]>=3.2",
    "httpx>=0.27",
    # Phase 3 — semantic core + CDC ingestion (contracts/, services/identity_resolver,
    # services/ingestion, tests/contracts/shacl).
    "rdflib>=7.0",
    "pyshacl>=0.29",
    "confluent-kafka>=2.5",
    # Phase 6 — durable action runtime (services/action_worker,
    # services/decision_service execute()).
    "temporalio>=1.33",
    # Phase 9 — MCP agent surface (services/mcp) + optional real-LLM
    # adversarial sub-experiment (tests/agent/). Pinned to the 1.x FastMCP
    # API deliberately: `mcp>=2` renames FastMCP -> MCPServer and changes
    # other APIs (see the package's own ModuleNotFoundError message on
    # `mcp.server.fastmcp` under 2.x) — 1.x is the stable, documented
    # surface this phase's code is written against.
    "mcp<2,>=1.2",
    "starlette",
    "anthropic>=0.40",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "destructive: tears down/rebuilds the shared docker-compose stack (e.g. 'make reset'); only runs when OO_ALLOW_DESTRUCTIVE=1 is set (see 'make test-destructive') — never part of a plain pytest/make test invocation (Phase 9 step 0a).",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []

[tool.setuptools.packages.find]
include = ["reference_model*", "seed*", "services*"]
