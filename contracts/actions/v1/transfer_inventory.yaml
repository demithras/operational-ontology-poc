# contracts/actions/v1/transfer_inventory.yaml
#
# docs/experiment/spec/05_ontology_and_contracts.md "ActionType contract"
# reference YAML, filled in for this repo's real WMS/RDF4J/OPA/OpenFGA
# wiring. Loaded by services/decision_service/action_types.py; sha256 of
# this file's raw bytes is pinned in contracts/manifests/current.json.
name: transfer_inventory
version: 1

parameters:
  source_warehouse:
    type: Warehouse
  destination_warehouse:
    type: Warehouse
  part:
    type: Part
  quantity:
    type: integer
    min: 1
  # Phase 6 step 0 (docs/adr/0003-protected-high-priority-transfer-authorization.md):
  # OPTIONAL, but a FORMAL parameter (not context) precisely because it is
  # now authorization-relevant — parameters are covered by
  # decision_content_hash (services/decision_service/hashing.py), context is
  # not, and F33 (approval invalidated by any input mutation) must apply to
  # whichever work order this transfer claims to mitigate. Evidence gathered
  # from it feeds `linked_work_order_risk` (unchanged fact name) plus the
  # work order's `priority` (fetched live from MES, since the work_order_risk
  # hot projection does not carry it — see evidence.py).
  work_order:
    type: WorkOrder
    required: false

# Deprecated but still accepted for backward compatibility with pre-Phase-6
# callers: the informational-only form of the same link. `parameters.work_order`
# is the canonical, hash-covered path going forward; evidence.py falls back
# to this only when `parameters.work_order` is absent.
context:
  work_order_id:
    type: WorkOrder
    required_for_evidence: [linked_work_order_risk]

reads:
  - InventoryLot
  - Warehouse
  - WorkOrder

authorization:
  relation: can_transfer_inventory
  object_binding: source_warehouse
  approval_relation: can_approve_large_transfer
  # Phase 6 step 0: checked ADDITIONALLY (same object as `relation` above,
  # see services/decision_service/authz.py::resolve_object), ONLY when
  # evidence resolves the linked work order's priority to HIGH. Absent for
  # the other two ActionTypes on purpose — this protection is specific to
  # transfer_inventory's role as the canonical HIGH-priority mitigation.
  protected_relation: can_mitigate_high_priority

policy:
  package: factory.inventory.transfer
  # 03_domain_scenario.md's exact number; also the canonical fixture's
  # policy_config.transfer_approval_threshold_units.
  approval_threshold_units: 100

evidence_requirements:
  - current_source_inventory
  - current_destination_compatibility
  - linked_work_order_risk
  - safety_stock

closure:
  required:
    - source_available
    - source_quality_status
    - safety_stock
    - destination_exists
  if_missing: insufficient_evidence
  # docs/experiment/spec/09_failure_and_adversarial_matrix.md F08 / spec 04's
  # STALE consistency status: evidence older than this is INSUFFICIENT_EVIDENCE
  # even if every required field is present (matches the canonical fixture's
  # policy_config.max_evidence_freshness_s: 5).
  max_evidence_freshness_s: 5

preconditions:
  - source != destination
  - source_available >= quantity

expected_effects:
  - source.available decreases by quantity
  - destination.available increases by quantity

external_operation:
  system: WMS
  operation: create_transfer

idempotency:
  key: action_execution_id

observation:
  source: WMS_CDC
  timeout: PT30S

compensation:
  mode: compensatable
  operation: reverse_transfer

audit:
  decision_required: true
  approval_if_policy_requires: true
